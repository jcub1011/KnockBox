# SemVer policy (pinned at v1.0.0):
#   * SDK `1.x.x` keeps a stable public contract for IGameModule,
#     IPluginManifest, IPluginContext, IPluginRegistration, AbstractGameEngine,
#     AbstractGameState, and the Platform's extension surface.
#   * Plugin authors pin `KnockBox.Core >=1.0.0 <2.0.0` (and if they use it,
#     the same range on KnockBox.Platform).
#   * Host `1.x.x` tracks the SDK `1.x.x` major line; the host and SDK share
#     a major. Do NOT release a host on a newer SDK major without bumping the
#     host's own major.
#   * Breaking changes to any of the contracts above require an SDK major
#     bump (2.0.0).
name: Release SDK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag (e.g. sdk-1.4.0)'
        required: true
        type: string
      core_version:
        description: 'KnockBox.Core NuGet version'
        required: true
        type: string
      platform_version:
        description: 'KnockBox.Platform NuGet version'
        required: true
        type: string
      templates_version:
        description: 'KnockBox.Templates NuGet version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-sdk-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate version formats
        env:
          CORE_V: ${{ inputs.core_version }}
          PLATFORM_V: ${{ inputs.platform_version }}
          TEMPLATES_V: ${{ inputs.templates_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          for V in "$CORE_V" "$PLATFORM_V" "$TEMPLATES_V"; do
            if [[ "$V" =~ ^v ]]; then
              echo "ERROR: NuGet version '$V' must not include a 'v' prefix."
              exit 1
            fi
            if [[ ! "$V" =~ ^[A-Za-z0-9._+-]+$ ]]; then
              echo "ERROR: Version '$V' contains invalid characters."
              exit 1
            fi
          done
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "ERROR: Release tag '$RELEASE_TAG' contains invalid characters."
            exit 1
          fi

  pack:
    name: Pack ${{ matrix.project }}
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Core
            id: core
          - project: Platform
            id: platform
          - project: Templates
            id: templates
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        env:
          CORE_V: ${{ inputs.core_version }}
          PLATFORM_V: ${{ inputs.platform_version }}
          TEMPLATES_V: ${{ inputs.templates_version }}
        run: |
          case "${{ matrix.project }}" in
            Core) VERSION="$CORE_V" ;;
            Platform) VERSION="$PLATFORM_V" ;;
            Templates) VERSION="$TEMPLATES_V" ;;
          esac
          dotnet pack sdk/KnockBox.${{ matrix.project }}/KnockBox.${{ matrix.project }}.csproj -c Release -p:Version="$VERSION" -o nupkg

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: knockbox-${{ matrix.id }}-nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg

  publish-nuget:
    name: Push to NuGet.org
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: nupkg
          pattern: knockbox-*-nupkg
          merge-multiple: true

      - name: NuGet Login
        id: oidc
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish all packages
        run: |
          shopt -s nullglob
          dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ steps.oidc.outputs.NUGET_API_KEY }}
          snupkgs=(nupkg/*.snupkg)
          if (( ${#snupkgs[@]} > 0 )); then
            dotnet nuget push "${snupkgs[@]}" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ steps.oidc.outputs.NUGET_API_KEY }}
          fi

  release-sdk:
    name: Publish GitHub Release (SDK)
    needs: [publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tag lookup)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Find previous SDK tag
        id: prev
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          PREV=$(git tag --list 'sdk-*' --sort=-v:refname | grep -Fv -- "$TAG" | head -n1)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Download all SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
          pattern: knockbox-*-nupkg
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: ${{ inputs.release_tag }}
          tag_name: ${{ inputs.release_tag }}
          previous_tag: ${{ steps.prev.outputs.tag }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.release_tag, '-') }}
