name: Release Host

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Host release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-host-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag input
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Host tags are conventionally vMAJOR.MINOR.PATCH[-suffix]. Reject
          # anything outside the SemVer-safe character set so we never pipe
          # metacharacter-bearing inputs into downstream shells or gh release.
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "ERROR: Tag '$TAG' contains characters outside [A-Za-z0-9._+-]."
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.rid }} (${{ matrix.mode }})
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        mode: [self-contained, framework-dependent]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore host/KnockBox/KnockBox.csproj -r ${{ matrix.rid }}

      - name: Publish host
        env:
          RID: ${{ matrix.rid }}
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = "self-contained" ]; then
            SELF_CONTAINED=true
          else
            SELF_CONTAINED=false
          fi
          dotnet publish host/KnockBox/KnockBox.csproj \
            -c Release \
            -r "$RID" \
            --no-restore \
            --self-contained $SELF_CONTAINED \
            -p:PublishSingleFile=false \
            -p:UseAppHost=true \
            -o "publish/${RID}-${MODE}"

      - name: Verify plugins in publish output
        env:
          RID: ${{ matrix.rid }}
          MODE: ${{ matrix.mode }}
        run: |
          PUBLISH_DIR="publish/${RID}-${MODE}"
          if [ ! -d "$PUBLISH_DIR/games" ]; then
            echo "ERROR: games/ folder missing from publish output"
            exit 1
          fi
          GAME_COUNT=$(find "$PUBLISH_DIR/games" -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Found $GAME_COUNT plugin folder(s) in $PUBLISH_DIR/games:"
          ls -1 "$PUBLISH_DIR/games"
          if [ "$GAME_COUNT" -lt 1 ]; then
            echo "ERROR: no plugins published"
            exit 1
          fi

      - name: Create archive
        id: archive
        env:
          TAG: ${{ inputs.tag }}
          RID: ${{ matrix.rid }}
          MODE: ${{ matrix.mode }}
        run: |
          ARCHIVE_NAME="knockbox-${TAG}-${RID}-${MODE}.zip"
          cd "publish/${RID}-${MODE}"
          zip -r "../../$ARCHIVE_NAME" .
          cd ../..
          echo "name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: knockbox-${{ matrix.rid }}-${{ matrix.mode }}
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Publish Docker image (${{ inputs.tag }})
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push versioned image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jabobb/knockbox:${{ inputs.tag }}
            jabobb/knockbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release (Host)
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tag lookup)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Find previous host tag
        id: prev
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -Fv -- "$TAG" | head -n1)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Download all publish artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: knockbox-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          name: ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          previous_tag: ${{ steps.prev.outputs.tag }}
          files: |
            artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
