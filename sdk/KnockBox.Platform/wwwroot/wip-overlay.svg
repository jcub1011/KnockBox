<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 900;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
    </style>
    <defs>
        <pattern id="wip-hazard" width="40" height="40"
                 patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
            <rect width="20" height="40" fill="#FFCC00"/>
            <rect x="20" width="20" height="40" fill="#000"/>
        </pattern>
        <filter id="wip-shadow" x="-10%" y="-50%" width="120%" height="200%">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
        </filter>
    </defs>
    <g transform="rotate(-15 150 100)" filter="url(#wip-shadow)">
        <rect x="-40" y="75" width="380" height="50"
              fill="url(#wip-hazard)" stroke="#000" stroke-width="2"/>
        <rect x="45" y="82" width="210" height="36"
              fill="#000" stroke="#FFCC00" stroke-width="2"/>
        <text x="150" y="106" text-anchor="middle" fill="#FFCC00"
              font-family="'Lexend', system-ui, sans-serif"
              font-size="17" font-weight="900" letter-spacing="1.5">
            WORK IN PROGRESS
        </text>
    </g>
</svg>
