<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 900;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Google Sans Code';
    font-style: normal;
    font-weight: 800;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Google Sans Code';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        @keyframes op-bloom-pulse {
            0%, 100% { opacity: 0.7; }
            50%      { opacity: 1; }
        }
        @keyframes op-delta-float-loop {
            0%, 70%, 100% { opacity: 0; transform: translateY(4px); }
            10%, 50%      { opacity: 1; transform: translateY(0); }
        }
        .op-bloom {
            animation: op-bloom-pulse 4s ease-in-out infinite;
        }
        .op-delta {
            animation: op-delta-float-loop 3s ease-out infinite;
            transform-origin: center;
            transform-box: fill-box;
        }

        .op-deck-card-body { fill: url(#op-deck-grad); stroke: #000; stroke-width: 2; }
        .op-deck-card-inner-stripes { fill: url(#op-deck-stripes); }
        .op-deck-card-inner-border { fill: none; stroke: rgba(230, 57, 70, 0.35); stroke-width: 1; }

        .op-operator-card-body { fill: #fffbeb; stroke: #000; stroke-width: 2; }
        .op-operator-card-rail { fill: #ffd166; }
        .op-symbol {
            fill: #000;
            font-family: 'Google Sans Code', 'Courier New', monospace;
            font-size: 38px;
            font-weight: 900;
        }

        .op-delta-text {
            fill: #2ecc71;
            font-family: 'Google Sans Code', 'Courier New', monospace;
            font-size: 11px;
            font-weight: 900;
            filter: drop-shadow(0 0 4px rgba(46, 204, 113, 0.6));
        }
        .op-score-value {
            fill: #ffd166;
            font-family: 'Google Sans Code', 'Courier New', monospace;
            font-size: 22px;
            font-weight: 900;
            filter: drop-shadow(0 0 6px rgba(255, 209, 102, 0.4));
        }
        .op-name {
            fill: #e63946;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .op-tag {
            fill: rgba(255, 251, 235, 0.5);
            font-family: 'Google Sans Code', 'Courier New', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
    </style>

    <defs>
        <radialGradient id="op-bg" cx="0.5" cy="0.6" r="0.7">
            <stop offset="0%"   stop-color="#1a0606"/>
            <stop offset="60%"  stop-color="#0f0505"/>
            <stop offset="100%" stop-color="#050202"/>
        </radialGradient>
        <radialGradient id="op-bloom-grad" cx="0.5" cy="0.55" r="0.55">
            <stop offset="0%"  stop-color="#e63946" stop-opacity="0.22"/>
            <stop offset="30%" stop-color="#e63946" stop-opacity="0.08"/>
            <stop offset="65%" stop-color="#e63946" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="op-deck-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#3d0000"/>
            <stop offset="50%"  stop-color="#1a0a0a"/>
            <stop offset="100%" stop-color="#3d0000"/>
        </linearGradient>
        <pattern id="op-deck-stripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="4" fill="transparent"/>
            <rect y="4" width="6" height="1" fill="rgba(230, 57, 70, 0.15)"/>
        </pattern>
        <filter id="op-name-shadow" x="-10%" y="-30%" width="120%" height="160%">
            <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e63946" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Dark red base + pulsing bloom -->
    <rect width="300" height="200" fill="url(#op-bg)"/>
    <rect class="op-bloom" width="300" height="200" fill="url(#op-bloom-grad)"/>

    <!-- Stage: two deck card backs + one operator card.
         Stage origin ~ (80, 30). Cards are 44x62. -->
    <!-- Back card 2 (back row, more rotated) -->
    <g transform="rotate(-7 102 67)">
        <rect x="80" y="36" width="44" height="62" rx="6" class="op-deck-card-body"/>
        <rect x="83" y="39" width="38" height="56" rx="4" class="op-deck-card-inner-stripes"/>
        <rect x="85" y="41" width="34" height="52" rx="3" class="op-deck-card-inner-border"/>
    </g>
    <!-- Back card 1 (slightly less rotated, offset right) -->
    <g transform="rotate(-3 110 65)">
        <rect x="88" y="34" width="44" height="62" rx="6" class="op-deck-card-body"/>
        <rect x="91" y="37" width="38" height="56" rx="4" class="op-deck-card-inner-stripes"/>
        <rect x="93" y="39" width="34" height="52" rx="3" class="op-deck-card-inner-border"/>
    </g>
    <!-- Operator card (front, rotated +5deg) -->
    <g transform="rotate(5 124 61)">
        <rect x="102" y="30" width="44" height="62" rx="8" class="op-operator-card-body"/>
        <rect x="102" y="30" width="4"  height="62" rx="2" class="op-operator-card-rail"/>
        <text x="126" y="73" text-anchor="middle" class="op-symbol">+</text>
    </g>

    <!-- Score block top-right -->
    <text class="op-delta op-delta-text" x="260" y="34" text-anchor="end">+1</text>
    <text x="270" y="64" text-anchor="end" class="op-score-value">7</text>

    <!-- Title + tagline -->
    <text x="150" y="148" text-anchor="middle" class="op-name" filter="url(#op-name-shadow)">OPERATOR</text>
    <text x="150" y="172" text-anchor="middle" class="op-tag">Stack operators. Strike opponents.</text>
</svg>
