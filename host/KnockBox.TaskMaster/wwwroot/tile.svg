<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 400;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        .tm-name {
            fill: #c8c8c8;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 28px;
            font-weight: 700;
        }
        .tm-tag {
            fill: #888;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 13px;
            font-style: italic;
        }
    </style>

    <!-- Plain dark gray background -->
    <rect width="300" height="200" fill="#2a2a2a"/>

    <!-- Title + tagline -->
    <text x="150" y="100" text-anchor="middle" class="tm-name">Task Master</text>
    <text x="150" y="125" text-anchor="middle" class="tm-tag">Complete tasks before time runs out.</text>
</svg>
