<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 900;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        .cc-card-body { fill: url(#cc-card-fill); stroke: #000; stroke-width: 2; }
        .cc-card-trim { fill: none; stroke: rgba(247, 213, 71, 0.65); stroke-width: 1; }
        .cc-card-trim-stripes { fill: url(#cc-card-stripes); }
        .cc-felt-border { fill: none; stroke: rgba(247, 213, 71, 0.35); stroke-width: 1; }
        .cc-chip-outer { fill: #c49a30; stroke: #000; stroke-width: 2; }
        .cc-chip-mid-gold { fill: #f7d547; }
        .cc-chip-ring { fill: #000; }
        .cc-chip-core { fill: #f7d547; }
        .cc-name {
            fill: #f7d547;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .cc-tag {
            fill: rgba(247, 213, 71, 0.72);
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>

    <defs>
        <radialGradient id="cc-felt" cx="0.5" cy="0.35" r="0.7">
            <stop offset="0%" stop-color="#128a55"/>
            <stop offset="55%" stop-color="#0a5c3b"/>
            <stop offset="100%" stop-color="#053a25"/>
        </radialGradient>
        <linearGradient id="cc-card-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#162447"/>
            <stop offset="100%" stop-color="#1f4068"/>
        </linearGradient>
        <pattern id="cc-weave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="3" height="8" fill="rgba(0,0,0,0.05)"/>
            <rect x="4" width="3" height="8" fill="rgba(255,255,255,0.02)"/>
        </pattern>
        <pattern id="cc-card-stripes" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="1" height="4" fill="rgba(247, 213, 71, 0.12)"/>
        </pattern>
        <filter id="cc-name-shadow" x="-10%" y="-30%" width="120%" height="160%">
            <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f7d547" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Felt background -->
    <rect width="300" height="200" fill="url(#cc-felt)"/>
    <rect width="300" height="200" fill="url(#cc-weave)"/>

    <!-- Inner gold border / glow -->
    <rect x="6" y="6" width="288" height="188" rx="10" class="cc-felt-border"/>

    <!-- Three-card fan, centered around (150, 50), card 36x52 -->
    <!-- Left card: rotated -12deg, shifted -14px from center, origin at bottom center -->
    <g transform="rotate(-12 150 76) translate(-14 0)">
        <rect x="132" y="24" width="36" height="52" rx="5" class="cc-card-body"/>
        <rect x="135" y="27" width="30" height="46" rx="3" class="cc-card-trim-stripes"/>
        <rect x="135" y="27" width="30" height="46" rx="3" class="cc-card-trim"/>
    </g>
    <!-- Right card: rotated +12deg, shifted +14px from center -->
    <g transform="rotate(12 150 76) translate(14 0)">
        <rect x="132" y="24" width="36" height="52" rx="5" class="cc-card-body"/>
        <rect x="135" y="27" width="30" height="46" rx="3" class="cc-card-trim-stripes"/>
        <rect x="135" y="27" width="30" height="46" rx="3" class="cc-card-trim"/>
    </g>
    <!-- Middle card: lifted -3px -->
    <g transform="translate(0 -3)">
        <rect x="132" y="24" width="36" height="52" rx="5" class="cc-card-body"/>
        <rect x="135" y="27" width="30" height="46" rx="3" class="cc-card-trim-stripes"/>
        <rect x="135" y="27" width="30" height="46" rx="3" class="cc-card-trim"/>
    </g>

    <!-- Chip stack bottom-left (x=22-44, y=140-170). Three chips, stacked rising. -->
    <g>
        <!-- Chip 3 (top of stack) -->
        <g transform="translate(26 142)">
            <circle cx="11" cy="11" r="11" class="cc-chip-outer"/>
            <circle cx="11" cy="11" r="6.6" class="cc-chip-mid-gold"/>
            <circle cx="11" cy="11" r="4.2" class="cc-chip-ring"/>
            <circle cx="11" cy="11" r="3.8" class="cc-chip-core"/>
        </g>
        <!-- Chip 2 -->
        <g transform="translate(24 152)">
            <circle cx="11" cy="11" r="11" class="cc-chip-outer"/>
            <circle cx="11" cy="11" r="6.6" class="cc-chip-mid-gold"/>
            <circle cx="11" cy="11" r="4.2" class="cc-chip-ring"/>
            <circle cx="11" cy="11" r="3.8" class="cc-chip-core"/>
        </g>
        <!-- Chip 1 (bottom of stack) -->
        <g transform="translate(22 162)">
            <circle cx="11" cy="11" r="11" class="cc-chip-outer"/>
            <circle cx="11" cy="11" r="6.6" class="cc-chip-mid-gold"/>
            <circle cx="11" cy="11" r="4.2" class="cc-chip-ring"/>
            <circle cx="11" cy="11" r="3.8" class="cc-chip-core"/>
        </g>
    </g>

    <!-- Title + Tagline -->
    <text x="150" y="138" text-anchor="middle" class="cc-name" filter="url(#cc-name-shadow)">CARD COUNTER</text>
    <text x="150" y="160" text-anchor="middle" class="cc-tag">Big Number Bad</text>
</svg>
