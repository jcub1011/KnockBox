<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 900;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        .dtd-name {
            fill: #2B2D42;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .dtd-tag {
            fill: #8E7BB3;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .dtd-swatch { stroke: #2B2D42; stroke-width: 1.5; filter: drop-shadow(1.5px 1.5px 0 #2B2D42); }
        .dtd-pencil-glyph {
            fill: #2B2D42;
            font-family: 'Segoe UI Symbol', 'Apple Color Emoji', sans-serif;
            font-size: 24px;
        }
    </style>

    <defs>
        <pattern id="dtd-dots" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="1" fill="rgba(177, 156, 217, 0.22)"/>
        </pattern>
        <filter id="dtd-name-shadow" x="-5%" y="-30%" width="110%" height="160%">
            <feDropShadow dx="0" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.06"/>
        </filter>
    </defs>

    <!-- Cream sketchpad background + dot pattern -->
    <rect width="300" height="200" fill="#F8F9FA"/>
    <rect width="300" height="200" fill="url(#dtd-dots)" opacity="0.55"/>

    <!-- Mannequin (original 60x80 viewBox, placed at top-center) -->
    <svg x="120" y="10" width="60" height="80" viewBox="0 0 60 80">
        <circle cx="30" cy="11" r="8" fill="none" stroke="#2B2D42" stroke-width="2.2"/>
        <line x1="30" y1="19" x2="30" y2="24" stroke="#2B2D42" stroke-width="2.2"/>
        <path d="M 16 26 Q 30 22 44 26 L 42 56 Q 30 60 18 56 Z"
              fill="none" stroke="#2B2D42" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M 18 30 Q 22 28 30 29 T 42 30 L 41 38 Q 30 41 19 38 Z"
              fill="none" stroke="#84E0C1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 22 27 Q 26 30 30 28 Q 34 30 38 27"
              fill="none" stroke="#B19CD9" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

    <!-- Palette swatches (bottom-left) -->
    <g>
        <circle cx="22" cy="180" r="6" fill="#FF85A1" class="dtd-swatch"/>
        <circle cx="40" cy="180" r="6" fill="#84E0C1" class="dtd-swatch"/>
        <circle cx="58" cy="180" r="6" fill="#FFD166" class="dtd-swatch"/>
        <circle cx="76" cy="180" r="6" fill="#B19CD9" class="dtd-swatch"/>
    </g>

    <!-- Pencil trail squiggle (bottom-right) -->
    <path d="M 230 180 Q 246 166 260 174 Q 274 184 286 168"
          fill="none" stroke="#B19CD9" stroke-width="1.5"
          stroke-linecap="round" stroke-dasharray="2 3" opacity="0.55"/>

    <!-- Pencil glyph (rotated 28deg, anchored bottom-right) -->
    <g transform="rotate(28 280 178)">
        <text x="280" y="186" text-anchor="middle" class="dtd-pencil-glyph">&#9998;</text>
    </g>

    <!-- Title -->
    <text x="150" y="125" text-anchor="middle" class="dtd-name" filter="url(#dtd-name-shadow)">DRAWN TO DRESS</text>
    <!-- Tagline -->
    <text x="150" y="150" text-anchor="middle" class="dtd-tag">Sketch outfits. Vote the runway.</text>
</svg>
