<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tracery">
  <!-- ════════════════════════════════════════════════════════════════════════
       TRACERY launcher tile. The game's own letter board is the hero — a cobalt
       word-trace spells TRACERY across it — crowned by a gilt rose-window /
       quatrefoil frieze and ruled with gilt hairlines. Palette hardcoded to the
       in-game tokens (tracery-theme.css). Hanken Grotesk (the in-game font) is
       embedded below as a base64 woff2 subset (latin letters) — external web
       fonts don't load in <img> context, so the face must travel inside the SVG.
       ════════════════════════════════════════════════════════════════════════ -->
  <defs>
    <linearGradient id="tr-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211b2c"/>
      <stop offset="0.55" stop-color="#1a1622"/>
      <stop offset="1" stop-color="#141019"/>
    </linearGradient>
    <radialGradient id="tr-candle" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#4d88cf" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#4d88cf" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4d88cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tr-glass-cobalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6aa8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#1f3556" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="tr-gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c45c"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#9c7a1e"/>
    </linearGradient>
    <filter id="tr-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      /* Hanken Grotesk (latin). An img-loaded SVG renders as a standalone document
         that can't reach the page's web fonts, so the in-game face is embedded
         inline. Subset regenerated by scripts/embed-tile-fonts.py. */
      /* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Hanken Grotesk';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
      .glow   { animation: tr-candle 3.8s ease-in-out infinite; }
      .litcur { animation: tr-litcur 3.8s ease-in-out infinite; }
      @keyframes tr-candle { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes tr-litcur { 0%,100% { opacity: 0.40; } 50% { opacity: 0.90; } }
      @media (prefers-reduced-motion: reduce) {
        .glow, .litcur { animation: none; opacity: 0.75; }
      }
    </style>
  </defs>

  <!-- Stone field + candle glow -->
  <rect width="300" height="200" fill="url(#tr-stone)"/>
  <rect width="300" height="200" fill="url(#tr-candle)" class="glow"/>

  <!-- ── Rose-window / quatrefoil frieze ──────────────────────────────────── -->
  <!-- rose window -->
  <g>
    <circle cx="150" cy="24" r="14" fill="url(#tr-glass-cobalt)" stroke="url(#tr-gilt)" stroke-width="1.6"/>
    <circle cx="150" cy="24" r="4.5" fill="url(#tr-glass-cobalt)" stroke="url(#tr-gilt)" stroke-width="1"/>
    <g fill="none" stroke="url(#tr-gilt)" stroke-width="0.9" opacity="0.92">
      <circle cx="150"   cy="15"   r="3"/><circle cx="157.8" cy="19.5" r="3"/>
      <circle cx="157.8" cy="28.5" r="3"/><circle cx="150"   cy="33"   r="3"/>
      <circle cx="142.2" cy="28.5" r="3"/><circle cx="142.2" cy="19.5" r="3"/>
    </g>
  </g>
  <!-- flanking quatrefoils -->
  <g fill="none" stroke="url(#tr-gilt)" stroke-width="0.85" opacity="0.85">
    <circle cx="54" cy="24" r="2.6"/><circle cx="54" cy="24" r="1.7"/>
    <circle cx="54" cy="20" r="2.6"/><circle cx="54" cy="28" r="2.6"/>
    <circle cx="50" cy="24" r="2.6"/><circle cx="58" cy="24" r="2.6"/>
    <circle cx="246" cy="24" r="2.6"/><circle cx="246" cy="24" r="1.7"/>
    <circle cx="246" cy="20" r="2.6"/><circle cx="246" cy="28" r="2.6"/>
    <circle cx="242" cy="24" r="2.6"/><circle cx="250" cy="24" r="2.6"/>
  </g>
  <!-- gilt hairline rules framing the board (the gold traces) -->
  <line x1="22" y1="44" x2="278" y2="44" stroke="url(#tr-gilt)" stroke-width="1.2" opacity="0.65"/>
  <line x1="22" y1="180" x2="278" y2="180" stroke="url(#tr-gilt)" stroke-width="1.2" opacity="0.65"/>

  <!-- ── The game board (5×5 letter grid) — the hero ──────────────────────── -->
  <!-- Resting cells -->
  <g fill="rgba(236,227,208,0.05)" stroke="rgba(201,162,39,0.28)" stroke-width="0.8">
    <rect x="89"  y="52"  width="21" height="21" rx="3"/><rect x="114" y="52"  width="21" height="21" rx="3"/><rect x="139" y="52"  width="21" height="21" rx="3"/><rect x="164" y="52"  width="21" height="21" rx="3"/><rect x="189" y="52"  width="21" height="21" rx="3"/>
    <rect x="89"  y="77"  width="21" height="21" rx="3"/><rect x="114" y="77"  width="21" height="21" rx="3"/><rect x="139" y="77"  width="21" height="21" rx="3"/><rect x="164" y="77"  width="21" height="21" rx="3"/><rect x="189" y="77"  width="21" height="21" rx="3"/>
    <rect x="89"  y="102" width="21" height="21" rx="3"/><rect x="114" y="102" width="21" height="21" rx="3"/><rect x="139" y="102" width="21" height="21" rx="3"/><rect x="164" y="102" width="21" height="21" rx="3"/><rect x="189" y="102" width="21" height="21" rx="3"/>
    <rect x="89"  y="127" width="21" height="21" rx="3"/><rect x="114" y="127" width="21" height="21" rx="3"/><rect x="139" y="127" width="21" height="21" rx="3"/><rect x="164" y="127" width="21" height="21" rx="3"/><rect x="189" y="127" width="21" height="21" rx="3"/>
    <rect x="89"  y="152" width="21" height="21" rx="3"/><rect x="114" y="152" width="21" height="21" rx="3"/><rect x="139" y="152" width="21" height="21" rx="3"/><rect x="164" y="152" width="21" height="21" rx="3"/><rect x="189" y="152" width="21" height="21" rx="3"/>
  </g>

  <!-- Traced cells (cobalt-tinted): T R A C E R -->
  <g fill="rgba(77,136,207,0.16)" stroke="#4d88cf" stroke-width="1">
    <rect x="89"  y="52"  width="21" height="21" rx="3"/><!-- T -->
    <rect x="114" y="52"  width="21" height="21" rx="3"/><!-- R -->
    <rect x="139" y="77"  width="21" height="21" rx="3"/><!-- A -->
    <rect x="139" y="102" width="21" height="21" rx="3"/><!-- C -->
    <rect x="114" y="102" width="21" height="21" rx="3"/><!-- E -->
    <rect x="114" y="127" width="21" height="21" rx="3"/><!-- R -->
  </g>

  <!-- Lit "current" cell (Y) with pulsing bloom -->
  <rect class="litcur" x="136" y="149" width="27" height="27" rx="5" fill="#4d88cf" filter="url(#tr-bloom)" opacity="0.65"/>
  <rect x="139" y="152" width="21" height="21" rx="3" fill="#4d88cf" stroke="#7fb0ea" stroke-width="1"/>

  <!-- Connecting trace polyline (T·R·A·C·E·R·Y) — soft glow, no travelling shine -->
  <g filter="url(#tr-bloom)">
    <polyline points="99.5,62.5 124.5,62.5 149.5,87.5 149.5,112.5 124.5,112.5 124.5,137.5 149.5,162.5"
              fill="none" stroke="#4d88cf" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Letters (in-game grotesque stack) -->
  <g font-family="'Hanken Grotesk', 'Outfit', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="99.5"  y="62.5"  fill="#bcd4f2" dominant-baseline="central">T</text>
    <text x="124.5" y="62.5"  fill="#bcd4f2" dominant-baseline="central">R</text>
    <text x="149.5" y="62.5"  fill="rgba(236,227,208,0.55)" dominant-baseline="central">O</text>
    <text x="174.5" y="62.5"  fill="rgba(236,227,208,0.55)" dominant-baseline="central">S</text>
    <text x="199.5" y="62.5"  fill="rgba(236,227,208,0.55)" dominant-baseline="central">N</text>
    <text x="99.5"  y="87.5"  fill="rgba(236,227,208,0.55)" dominant-baseline="central">D</text>
    <text x="124.5" y="87.5"  fill="rgba(236,227,208,0.55)" dominant-baseline="central">L</text>
    <text x="149.5" y="87.5"  fill="#bcd4f2" dominant-baseline="central">A</text>
    <text x="174.5" y="87.5"  fill="rgba(236,227,208,0.55)" dominant-baseline="central">H</text>
    <text x="199.5" y="87.5"  fill="rgba(236,227,208,0.55)" dominant-baseline="central">M</text>
    <text x="99.5"  y="112.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">I</text>
    <text x="124.5" y="112.5" fill="#bcd4f2" dominant-baseline="central">E</text>
    <text x="149.5" y="112.5" fill="#bcd4f2" dominant-baseline="central">C</text>
    <text x="174.5" y="112.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">P</text>
    <text x="199.5" y="112.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">B</text>
    <text x="99.5"  y="137.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">U</text>
    <text x="124.5" y="137.5" fill="#bcd4f2" dominant-baseline="central">R</text>
    <text x="149.5" y="137.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">K</text>
    <text x="174.5" y="137.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">G</text>
    <text x="199.5" y="137.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">F</text>
    <text x="99.5"  y="162.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">O</text>
    <text x="124.5" y="162.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">W</text>
    <text x="149.5" y="162.5" fill="#f4ecd9" dominant-baseline="central">Y</text>
    <text x="174.5" y="162.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">V</text>
    <text x="199.5" y="162.5" fill="rgba(236,227,208,0.55)" dominant-baseline="central">Z</text>
  </g>
</svg>
