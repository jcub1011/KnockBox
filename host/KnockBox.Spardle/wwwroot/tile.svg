<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Bowlby One SC';
    font-style: normal;
    font-weight: 400;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 600;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        .spardle-letter-correct {
            fill: #14f195;
            stroke: #000;
            stroke-width: 2;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.85)) drop-shadow(0 0 6px rgba(20, 241, 149, 0.55));
        }
        .spardle-letter-present {
            fill: #ffae00;
            stroke: #000;
            stroke-width: 2;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.85)) drop-shadow(0 0 6px rgba(255, 174, 0, 0.5));
        }
        .spardle-letter-absent {
            fill: #2a2f4a;
            stroke: transparent;
            stroke-width: 2;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.6));
        }
        .spardle-letter-text-dark {
            fill: #042418;
            font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
            font-size: 17px;
            font-weight: 700;
        }
        .spardle-letter-text-amber {
            fill: #2a1900;
            font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
            font-size: 17px;
            font-weight: 700;
        }
        .spardle-letter-text-faded {
            fill: rgba(244, 246, 255, 0.55);
            font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
            font-size: 17px;
            font-weight: 700;
        }
        .spardle-name {
            font-family: 'Bowlby One SC', Impact, 'Arial Black', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .spardle-name-spar { fill: #00d1ff; }
        .spardle-name-dash { fill: #f4f6ff; }
        .spardle-name-dle  { fill: #ff2e63; }
        .spardle-tag {
            fill: rgba(244, 246, 255, 0.72);
            font-family: 'Manrope', system-ui, -apple-system, sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
    </style>

    <defs>
        <radialGradient id="spardle-bg" cx="0.5" cy="0" r="1.0">
            <stop offset="0%"   stop-color="#1a1f3b"/>
            <stop offset="55%"  stop-color="#0f1426"/>
            <stop offset="100%" stop-color="#070912"/>
        </radialGradient>
        <radialGradient id="spardle-glow-cyan" cx="0.25" cy="0.15" r="0.5">
            <stop offset="0%"  stop-color="#00d1ff" stop-opacity="0.18"/>
            <stop offset="70%" stop-color="#00d1ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="spardle-glow-pink" cx="0.8" cy="0.9" r="0.5">
            <stop offset="0%"  stop-color="#ff2e63" stop-opacity="0.14"/>
            <stop offset="70%" stop-color="#ff2e63" stop-opacity="0"/>
        </radialGradient>
        <pattern id="spardle-grid" width="22" height="22" patternUnits="userSpaceOnUse">
            <path d="M 22 0 L 0 0 0 22" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
        </pattern>
        <filter id="spardle-name-shadow" x="-5%" y="-30%" width="110%" height="160%">
            <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
            <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00d1ff" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Base + glows + grid pattern -->
    <rect width="300" height="200" fill="url(#spardle-bg)"/>
    <rect width="300" height="200" fill="url(#spardle-glow-cyan)"/>
    <rect width="300" height="200" fill="url(#spardle-glow-pink)"/>
    <rect width="300" height="200" fill="url(#spardle-grid)"/>

    <!-- 7-letter grid: boxes at x=47, y=28; box 26x26; gap 4; columns at x=47+i*30 -->
    <!-- S - correct -->
    <rect x="47"  y="28" width="26" height="26" rx="4" class="spardle-letter-correct"/>
    <text x="60"  y="49" text-anchor="middle" class="spardle-letter-text-dark">S</text>
    <!-- P - absent -->
    <rect x="77"  y="28" width="26" height="26" rx="4" class="spardle-letter-absent"/>
    <text x="90"  y="49" text-anchor="middle" class="spardle-letter-text-faded">P</text>
    <!-- A - present -->
    <rect x="107" y="28" width="26" height="26" rx="4" class="spardle-letter-present"/>
    <text x="120" y="49" text-anchor="middle" class="spardle-letter-text-amber">A</text>
    <!-- R - correct -->
    <rect x="137" y="28" width="26" height="26" rx="4" class="spardle-letter-correct"/>
    <text x="150" y="49" text-anchor="middle" class="spardle-letter-text-dark">R</text>
    <!-- D - absent -->
    <rect x="167" y="28" width="26" height="26" rx="4" class="spardle-letter-absent"/>
    <text x="180" y="49" text-anchor="middle" class="spardle-letter-text-faded">D</text>
    <!-- L - present -->
    <rect x="197" y="28" width="26" height="26" rx="4" class="spardle-letter-present"/>
    <text x="210" y="49" text-anchor="middle" class="spardle-letter-text-amber">L</text>
    <!-- E - correct -->
    <rect x="227" y="28" width="26" height="26" rx="4" class="spardle-letter-correct"/>
    <text x="240" y="49" text-anchor="middle" class="spardle-letter-text-dark">E</text>

    <!-- "SPAR–DLE" title: three runs with different colors -->
    <g filter="url(#spardle-name-shadow)">
        <text x="150" y="115" text-anchor="middle" class="spardle-name">
            <tspan class="spardle-name-spar">SPAR</tspan><tspan class="spardle-name-dash" dx="2" dy="0">–</tspan><tspan class="spardle-name-dle" dx="2" dy="0">DLE</tspan>
        </text>
    </g>

    <!-- Tagline -->
    <text x="150" y="148" text-anchor="middle" class="spardle-tag">Head-to-head word-le combat</text>
</svg>
