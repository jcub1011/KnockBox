<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Share Tech Mono';
    font-style: normal;
    font-weight: 400;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        @keyframes ctc-blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .ctc-caret {
            fill: #a78bfa;
            filter: drop-shadow(0 0 4px rgba(167, 139, 250, 0.55));
            animation: ctc-blink 1s steps(1) infinite;
        }
        .ctc-prompt {
            fill: #a78bfa;
            font-family: 'Share Tech Mono', 'Google Sans Code', monospace;
            font-size: 18px;
            font-weight: 700;
        }
        .ctc-name {
            fill: #fff;
            font-family: 'Share Tech Mono', 'Google Sans Code', monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .ctc-intel-label {
            fill: #a78bfa;
            font-family: 'Share Tech Mono', 'Google Sans Code', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }
        .ctc-classified {
            fill: #fff;
            font-family: 'Share Tech Mono', 'Google Sans Code', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
        }
        .ctc-tag {
            fill: rgba(167, 139, 250, 0.7);
            font-family: 'Share Tech Mono', 'Google Sans Code', monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }
    </style>

    <defs>
        <radialGradient id="ctc-bg" cx="0.5" cy="0.5" r="0.8">
            <stop offset="0%" stop-color="#1a1a2e"/>
            <stop offset="100%" stop-color="#0f0f1a"/>
        </radialGradient>
        <pattern id="ctc-scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="2" fill="transparent"/>
            <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.18)"/>
        </pattern>
        <radialGradient id="ctc-vignette" cx="0.5" cy="0.5" r="0.8">
            <stop offset="0%"  stop-color="#a78bfa" stop-opacity="0.06"/>
            <stop offset="35%" stop-color="#000"    stop-opacity="0"/>
            <stop offset="70%" stop-color="#000"    stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#000"   stop-opacity="0.55"/>
        </radialGradient>
        <filter id="ctc-glow-name" x="-10%" y="-30%" width="120%" height="160%">
            <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a78bfa" flood-opacity="0.55"/>
            <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#a78bfa" flood-opacity="0.4"/>
        </filter>
    </defs>

    <rect width="300" height="200" fill="url(#ctc-bg)"/>
    <rect width="300" height="200" fill="url(#ctc-scanlines)"/>
    <rect width="300" height="200" fill="url(#ctc-vignette)"/>

    <!-- Prompt line: "> CODEWORD ▮" -->
    <text x="22" y="70" class="ctc-prompt">&gt;</text>
    <text x="40" y="70" class="ctc-name" filter="url(#ctc-glow-name)">CODEWORD</text>
    <rect class="ctc-caret" x="187" y="55" width="8" height="18"/>

    <!-- Intel line: "[INTEL]" label + redacted pill with "CLASSIFIED" -->
    <text x="22" y="118" class="ctc-intel-label">[INTEL]</text>
    <g>
        <rect x="80" y="105" width="200" height="20" rx="10"
              fill="rgba(167, 139, 250, 0.15)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <rect x="80" y="105" width="200" height="20" rx="10"
              fill="rgba(15, 15, 26, 0.85)"/>
        <text x="180" y="119" text-anchor="middle" class="ctc-classified">CLASSIFIED</text>
    </g>

    <!-- Tagline -->
    <text x="22" y="158" class="ctc-tag">Decode the intel. Smoke out the spy.</text>
</svg>
