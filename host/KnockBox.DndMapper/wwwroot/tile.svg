<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
        @keyframes dndm-tile-token-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.08); opacity: 0.92; }
        }

        .dndm-tile-token {
            stroke-width: 1.2;
            transform-origin: center;
            transform-box: fill-box;
            animation: dndm-tile-token-pulse 3.4s ease-in-out infinite;
        }
        .dndm-tile-token--ally {
            fill: #e89055;
            stroke: #fde0b8;
            filter: drop-shadow(0 0 4px rgba(232, 144, 85, 0.55));
        }
        .dndm-tile-token--foe {
            fill: #b04a3a;
            stroke: #f0c8b8;
            filter: drop-shadow(0 0 4px rgba(176, 74, 58, 0.5));
        }
        #token-2 { animation-delay: 0.7s; }
        #token-3 { animation-delay: 1.4s; }
        #token-4 { animation-delay: 2.1s; }

        .dndm-tile-grid-line { fill: none; stroke: rgba(196, 116, 56, 0.22); stroke-width: 0.4; }
        .dndm-tile-wall {
            fill: none;
            stroke: rgba(196, 116, 56, 0.55);
            stroke-width: 2.2;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .dndm-tile-die-shell {
            fill: rgba(16, 12, 8, 0.92);
            stroke: #e89055;
            stroke-width: 1.8;
            stroke-linejoin: round;
        }
        .dndm-tile-die-face { stroke: rgba(232, 144, 85, 0.45); stroke-width: 0.8; stroke-linejoin: round; }
        .dndm-tile-die-face--bright { fill: rgba(232, 144, 85, 0.28); }
        .dndm-tile-die-face--mid    { fill: rgba(196, 116, 56, 0.18); }
        .dndm-tile-die-face--dim    { fill: rgba(20, 16, 12, 0.55); }
        .dndm-tile-die-num {
            fill: #fde0b8;
            font-family: "Open Sans", "Segoe UI", Arial, sans-serif;
            font-size: 17px;
            font-weight: 700;
            paint-order: stroke;
            stroke: rgba(0, 0, 0, 0.6);
            stroke-width: 0.8;
        }
        .dndm-tile-die-wrap { filter: drop-shadow(0 0 14px rgba(232, 144, 85, 0.45)); }

        .dndm-tile-name-drop {
            font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
            font-size: 30px;
            font-weight: 700;
            font-style: italic;
            fill: #e89055;
            filter: drop-shadow(0 0 6px rgba(232, 144, 85, 0.85));
        }
        .dndm-tile-name-rest {
            font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
            font-size: 20px;
            font-weight: 500;
            font-style: italic;
            fill: #ece0cc;
        }
        .dndm-tile-tag {
            font-family: "Open Sans", "Segoe UI", Arial, sans-serif;
            font-size: 7.5px;
            fill: #b29a7e;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @media (prefers-reduced-motion: reduce) {
            .dndm-tile-token { animation: none; }
        }
    </style>

    <defs>
        <pattern id="dndm-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path class="dndm-tile-grid-line" d="M 20 0 L 0 0 0 20" />
        </pattern>
        <radialGradient id="dndm-glow" cx="0.5" cy="1" r="0.85">
            <stop offset="0%" stop-color="#e89055" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#e89055" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="dndm-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#1d1814" />
            <stop offset="65%" stop-color="#14100c" />
            <stop offset="100%" stop-color="#0a0806" />
        </linearGradient>
        <radialGradient id="dndm-bg-ember" cx="0.5" cy="1.2" r="0.55">
            <stop offset="0%"  stop-color="#e89055" stop-opacity="0.22" />
            <stop offset="55%" stop-color="#e89055" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="dndm-plaque" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#080604" stop-opacity="0" />
            <stop offset="35%"  stop-color="#080604" stop-opacity="0.72" />
            <stop offset="100%" stop-color="#040302" stop-opacity="0.95" />
        </linearGradient>
        <linearGradient id="dndm-rule" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#c4743a" stop-opacity="0" />
            <stop offset="30%"  stop-color="#c4743a" stop-opacity="0.7" />
            <stop offset="50%"  stop-color="#e89055" stop-opacity="0.7" />
            <stop offset="70%"  stop-color="#c4743a" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#c4743a" stop-opacity="0" />
        </linearGradient>
    </defs>

    <rect width="300" height="200" fill="url(#dndm-bg)" />
    <rect width="300" height="200" fill="url(#dndm-bg-ember)" />
    <rect width="300" height="200" fill="url(#dndm-grid)" />
    <rect width="300" height="200" fill="url(#dndm-glow)" />

    <path class="dndm-tile-wall" d="M 18 95 L 132 95 L 132 115 L 282 115" />

    <circle id="token-1" class="dndm-tile-token dndm-tile-token--ally" cx="50"  cy="56" r="7" />
    <circle id="token-2" class="dndm-tile-token dndm-tile-token--ally" cx="90"  cy="78" r="6" />
    <circle id="token-3" class="dndm-tile-token dndm-tile-token--foe"  cx="248" cy="48" r="7" />
    <circle id="token-4" class="dndm-tile-token dndm-tile-token--foe"  cx="208" cy="72" r="6" />

    <g class="dndm-tile-die-wrap">
        <svg x="230" y="12" width="58" height="58" viewBox="0 0 64 64">
            <polygon class="dndm-tile-die-shell" points="32,6 54,19 54,45 32,58 10,45 10,19" />
            <polygon class="dndm-tile-die-face dndm-tile-die-face--bright" points="32,6 54,19 32,32" />
            <polygon class="dndm-tile-die-face dndm-tile-die-face--dim"    points="32,6 10,19 32,32" />
            <polygon class="dndm-tile-die-face dndm-tile-die-face--mid"    points="32,32 32,58 10,45" />
            <text class="dndm-tile-die-num" x="32" y="48.5" text-anchor="middle">20</text>
        </svg>
    </g>

    <rect x="0" y="140" width="300" height="60" fill="url(#dndm-plaque)" />
    <rect x="42" y="148" width="216" height="1" fill="url(#dndm-rule)" />

    <text x="150" y="180" text-anchor="middle">
        <tspan class="dndm-tile-name-drop">D</tspan><tspan class="dndm-tile-name-rest" dx="1">nD Mapper</tspan>
    </text>
    <text class="dndm-tile-tag" x="150" y="192" text-anchor="middle">Collaborative Tabletop Maps</text>
</svg>
