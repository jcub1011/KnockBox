<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="Linked List — forge the word chain">
    <style><![CDATA[
/* Chakra Petch 700 (latin). The tile renders as a standalone image document and
   cannot reach the page's web fonts, so the engraved nameplate font is embedded
   inline. Subset regenerated by scripts/embed-tile-fonts.py. */
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Chakra Petch';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        .ll-word {
            font-family: 'Chakra Petch', 'Arial Narrow', Impact, sans-serif;
            font-weight: 700;
            fill: #eef3f9;
        }
        .ll-tag {
            font-family: 'Chakra Petch', 'Arial Narrow', sans-serif;
            font-weight: 700;
            fill: rgba(238, 243, 249, 0.58);
            letter-spacing: 2.4px;
        }
]]></style>

    <defs>
        <!-- Brushed-steel ring edge (reused across the chain). -->
        <linearGradient id="ll-steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"    stop-color="#e3ecf8"/>
            <stop offset="0.45" stop-color="#9aa8bc"/>
            <stop offset="0.62" stop-color="#5d6a7d"/>
            <stop offset="1"    stop-color="#cfdcef"/>
        </linearGradient>
        <!-- Gold — the locked destination ring. -->
        <linearGradient id="ll-gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"    stop-color="#fff0cf"/>
            <stop offset="0.5"  stop-color="#e8c069"/>
            <stop offset="0.65" stop-color="#9c7d2f"/>
            <stop offset="1"    stop-color="#fff0cf"/>
        </linearGradient>
        <!-- Top cyan sheen catching the gunmetal surface. -->
        <radialGradient id="ll-sheen" cx="150" cy="-26" r="180" gradientUnits="userSpaceOnUse">
            <stop offset="0"    stop-color="#58c7e0" stop-opacity="0.16"/>
            <stop offset="0.55" stop-color="#58c7e0" stop-opacity="0"/>
        </radialGradient>
        <!-- Bottom vignette. -->
        <radialGradient id="ll-vignette" cx="150" cy="232" r="190" gradientUnits="userSpaceOnUse">
            <stop offset="0"   stop-color="#000000" stop-opacity="0.5"/>
            <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <!-- Faint diagonal hairlines — the grain of polished steel. -->
        <pattern id="ll-grain-a" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(48)">
            <line x1="0" y1="0" x2="0" y2="7" stroke="#bed2eb" stroke-opacity="0.05" stroke-width="1"/>
        </pattern>
        <pattern id="ll-grain-b" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-48)">
            <line x1="0" y1="0" x2="0" y2="10" stroke="#bed2eb" stroke-opacity="0.035" stroke-width="1"/>
        </pattern>
        <!-- Soft gold glow for the locked destination. -->
        <filter id="ll-gold-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e8c069" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- ── Gunmetal field ── -->
    <rect width="300" height="200" fill="#0d1018"/>
    <rect width="300" height="200" fill="url(#ll-grain-a)"/>
    <rect width="300" height="200" fill="url(#ll-grain-b)"/>
    <rect width="300" height="200" fill="url(#ll-sheen)"/>
    <rect width="300" height="200" fill="url(#ll-vignette)"/>

    <!-- ── The chain-linked wordmark: two link-capsules joined by a forged ring ── -->

    <!-- START anchor: cyan diamond, top-left of the first link. -->
    <path d="M44 59 L51 66 L44 73 L37 66 Z" fill="#58c7e0"/>

    <!-- LINKED — the start link (steel ring-capsule). -->
    <rect x="60" y="44" width="180" height="44" rx="22"
          fill="#141a24" stroke="url(#ll-steel)" stroke-width="3.5"/>
    <rect x="63" y="47" width="174" height="38" rx="19"
          fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <text x="150" y="67" text-anchor="middle" dominant-baseline="central"
          class="ll-word" font-size="27" letter-spacing="2.5">LINKED</text>

    <!-- LIST — the destination link, locked gold and glowing. -->
    <rect x="96" y="112" width="108" height="44" rx="22" filter="url(#ll-gold-glow)"
          fill="#191510" stroke="url(#ll-gold)" stroke-width="3.5"/>
    <rect x="99" y="115" width="102" height="38" rx="19"
          fill="none" stroke="#fff0cf" stroke-opacity="0.18" stroke-width="1"/>
    <text x="150" y="135" text-anchor="middle" dominant-baseline="central"
          class="ll-word" font-size="27" letter-spacing="3">LIST</text>

    <!-- DESTINATION end-ring: gold fisheye, bottom-right of the last link. -->
    <circle cx="218" cy="134" r="8" fill="none" stroke="url(#ll-gold)" stroke-width="3"/>
    <circle cx="218" cy="134" r="3" fill="#e8c069"/>

    <!-- Forged connector: a perpendicular open ring threading the two links
         (drawn last so it overlaps both borders — the interlocking illusion). -->
    <rect x="139" y="80" width="22" height="40" rx="11"
          fill="none" stroke="url(#ll-steel)" stroke-width="4"/>

    <!-- ── Tagline ── -->
    <text x="150" y="182" text-anchor="middle" class="ll-tag" font-size="10.5">BUILD A LINK ONE WORD AT A TIME</text>
</svg>
