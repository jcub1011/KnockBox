<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <defs>
        <linearGradient id="ac-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f2027"/>
            <stop offset="0.55" stop-color="#1d3b53"/>
            <stop offset="1" stop-color="#13443f"/>
        </linearGradient>
        <linearGradient id="ac-link" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5aa9e6"/>
            <stop offset="1" stop-color="#3ad29f"/>
        </linearGradient>
    </defs>

    <rect width="300" height="200" fill="url(#ac-bg)"/>

    <!-- faint interlocking-chain watermark -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="10">
        <rect x="-10" y="150" width="60" height="30" rx="15"/>
        <rect x="30" y="150" width="60" height="30" rx="15"/>
        <rect x="250" y="20" width="60" height="30" rx="15"/>
    </g>

    <!-- chain-link glyph: two interlocking links -->
    <g fill="none" stroke="url(#ac-link)" stroke-width="11" stroke-linecap="round">
        <rect x="34" y="78" width="62" height="34" rx="17"/>
        <rect x="80" y="78" width="62" height="34" rx="17"/>
    </g>

    <!-- wordmark -->
    <text x="160" y="92"
          font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800"
          letter-spacing="2" fill="#ffffff">ALPHA</text>
    <text x="160" y="132"
          font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800"
          letter-spacing="2" fill="url(#ac-link)">CHAIN</text>

    <!-- tagline -->
    <text x="36" y="166"
          font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600"
          letter-spacing="3" fill="#cfe8f5" fill-opacity="0.85">BUILD&#160;THE&#160;VALUE&#160;CHAIN</text>
</svg>
