<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <defs>
        <radialGradient id="ac-bg" cx="0.5" cy="0.1" r="1.1">
            <stop offset="0%"   stop-color="#141a30"/>
            <stop offset="55%"  stop-color="#0c1020"/>
            <stop offset="100%" stop-color="#06080f"/>
        </radialGradient>
        <radialGradient id="ac-glow-cyan" cx="0.18" cy="0.12" r="0.55">
            <stop offset="0%"  stop-color="#00e5ff" stop-opacity="0.22"/>
            <stop offset="70%" stop-color="#00e5ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ac-glow-mag" cx="0.85" cy="0.92" r="0.55">
            <stop offset="0%"  stop-color="#ff2e8b" stop-opacity="0.20"/>
            <stop offset="70%" stop-color="#ff2e8b" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ac-wordmark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#00e5ff"/>
            <stop offset="1"   stop-color="#ff2e8b"/>
        </linearGradient>
        <pattern id="ac-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        </pattern>
        <filter id="ac-name-glow" x="-10%" y="-40%" width="120%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.45"/>
        </filter>
        <filter id="ac-tile-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00e5ff" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Base + glows + grid -->
    <rect width="300" height="200" fill="url(#ac-bg)"/>
    <rect width="300" height="200" fill="url(#ac-glow-cyan)"/>
    <rect width="300" height="200" fill="url(#ac-glow-mag)"/>
    <rect width="300" height="200" fill="url(#ac-grid)"/>

    <!-- Letter-tile chain: C·A·T·E·R, the trailing tile lit as the "link" -->
    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="18" font-weight="700" text-anchor="middle">
        <!-- C -->
        <rect x="63"  y="24" width="30" height="30" rx="5" fill="#141a30" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="78"  y="45" fill="#eaf2ff">C</text>
        <!-- A -->
        <rect x="99"  y="24" width="30" height="30" rx="5" fill="#141a30" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="114" y="45" fill="#eaf2ff">A</text>
        <!-- T -->
        <rect x="135" y="24" width="30" height="30" rx="5" fill="#141a30" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="150" y="45" fill="#eaf2ff">T</text>
        <!-- E -->
        <rect x="171" y="24" width="30" height="30" rx="5" fill="#141a30" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text x="186" y="45" fill="#eaf2ff">E</text>
        <!-- R - lit link tile -->
        <rect x="207" y="24" width="30" height="30" rx="5" fill="rgba(0,229,255,0.18)" stroke="#00e5ff" stroke-width="1.5" filter="url(#ac-tile-glow)"/>
        <text x="222" y="45" fill="#00e5ff">R</text>
    </g>

    <!-- Interlocking chain-link glyph -->
    <g fill="none" stroke="url(#ac-wordmark)" stroke-width="7" stroke-linecap="round" filter="url(#ac-name-glow)">
        <rect x="116" y="74" width="40" height="22" rx="11"/>
        <rect x="146" y="74" width="40" height="22" rx="11"/>
    </g>

    <!-- Wordmark -->
    <g font-family="'Arial Black','Arial Bold',Impact,sans-serif" font-weight="800" text-anchor="middle">
        <text x="150" y="138" font-size="40" letter-spacing="2"
              fill="url(#ac-wordmark)" filter="url(#ac-name-glow)">ALPHA</text>
        <text x="150" y="170" font-size="26" letter-spacing="8" fill="#eaf2ff">CHAIN</text>
    </g>

    <!-- Tagline -->
    <text x="150" y="190" text-anchor="middle"
          font-family="'Manrope',system-ui,sans-serif" font-size="9" font-weight="600"
          letter-spacing="3" fill="rgba(234,242,255,0.6)">WORD-CHAIN&#160;ENGINE&#160;BUILDER</text>
</svg>
