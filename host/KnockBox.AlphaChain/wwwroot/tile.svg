<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Bricolage Grotesque';
    font-style: normal;
    font-weight: 800;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Google Sans Code';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        .ac-word {
            font-family: 'Bricolage Grotesque', 'Outfit', system-ui, sans-serif;
            font-weight: 800;
            font-size: 46px;
            letter-spacing: 2px;
            fill: url(#ac-wordmark);
        }
        .ac-tag {
            font-family: 'Google Sans Code', 'Courier New', monospace;
            font-weight: 700;
            font-size: 9.5px;
            letter-spacing: 3px;
            fill: #9fd6ec;
            filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.35));
        }
        .ac-link { fill: none; stroke-width: 8.5; stroke-linecap: round; stroke-linejoin: round; }
        .ac-link-1 { stroke: #00e5ff; animation: ac-breathe-c 3.6s ease-in-out infinite; }
        .ac-link-2 { stroke: #ff2e8b; animation: ac-breathe-m 3.6s ease-in-out infinite; animation-delay: -1.8s; }

        /* Breathe the glow only -- keep the rings fully opaque so the interlock stays crisp. */
        @keyframes ac-breathe-c {
            0%, 100% { filter: drop-shadow(0 0 3px rgba(0, 229, 255, 0.50)); }
            50%      { filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.95)); }
        }
        @keyframes ac-breathe-m {
            0%, 100% { filter: drop-shadow(0 0 3px rgba(255, 46, 139, 0.50)); }
            50%      { filter: drop-shadow(0 0 10px rgba(255, 46, 139, 0.95)); }
        }
        @media (prefers-reduced-motion: reduce) {
            .ac-link-1, .ac-link-2 { animation: none; }
        }
    </style>

    <defs>
        <radialGradient id="ac-bg" cx="0.5" cy="0.1" r="1.1">
            <stop offset="0%"   stop-color="#141a30"/>
            <stop offset="55%"  stop-color="#0c1020"/>
            <stop offset="100%" stop-color="#06080f"/>
        </radialGradient>
        <radialGradient id="ac-glow-cyan" cx="0.18" cy="0.12" r="0.55">
            <stop offset="0%"  stop-color="#00e5ff" stop-opacity="0.22"/>
            <stop offset="70%" stop-color="#00e5ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ac-glow-mag" cx="0.85" cy="0.92" r="0.55">
            <stop offset="0%"  stop-color="#ff2e8b" stop-opacity="0.20"/>
            <stop offset="70%" stop-color="#ff2e8b" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ac-wordmark" x1="0" y1="0" x2="1" y2="0.25">
            <stop offset="0"   stop-color="#00e5ff"/>
            <stop offset="0.5" stop-color="#b97bff"/>
            <stop offset="1"   stop-color="#ff2e8b"/>
        </linearGradient>
        <pattern id="ac-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        </pattern>
        <filter id="ac-name-glow" x="-12%" y="-45%" width="124%" height="190%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00e5ff" flood-opacity="0.40"/>
        </filter>
        <!-- Restores the magenta link's lower crossing on top of the cyan link, so
             the two rings interlock (cyan in front up top, magenta in front below)
             while both rings stay completely intact. -->
        <clipPath id="ac-cross">
            <circle cx="150" cy="123" r="12"/>
        </clipPath>
    </defs>

    <!-- Base + glows + grid -->
    <rect width="300" height="200" fill="url(#ac-bg)"/>
    <rect width="300" height="200" fill="url(#ac-glow-cyan)"/>
    <rect width="300" height="200" fill="url(#ac-glow-mag)"/>
    <rect width="300" height="200" fill="url(#ac-grid)"/>

    <!-- Hero wordmark, top line -->
    <text x="150" y="64" text-anchor="middle" class="ac-word" filter="url(#ac-name-glow)">ALPHA</text>

    <!-- Forged link: magenta ring, cyan ring on top, then magenta's lower crossing redrawn -->
    <rect class="ac-link ac-link-2" x="145" y="82" width="34" height="46" rx="17"/>
    <rect class="ac-link ac-link-1" x="121" y="82" width="34" height="46" rx="17"/>
    <g clip-path="url(#ac-cross)">
        <rect class="ac-link ac-link-2" x="145" y="82" width="34" height="46" rx="17"/>
    </g>

    <!-- Hero wordmark, bottom line -->
    <text x="150" y="166" text-anchor="middle" class="ac-word" filter="url(#ac-name-glow)">CHAIN</text>

    <!-- Tagline -->
    <text x="150" y="190" text-anchor="middle" class="ac-tag">WORD-CHAIN&#160;ENGINE&#160;BUILDER</text>
</svg>
