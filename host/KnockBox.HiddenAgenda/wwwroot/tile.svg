<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">
    <style>
/* EMBEDDED FONTS BEGIN */
@font-face {
    font-family: 'Playfair Display';
    font-style: normal;
    font-weight: 700;
    src: url('data:font/woff2;base64,') format('woff2');
}
@font-face {
    font-family: 'Playfair Display';
    font-style: italic;
    font-weight: 400;
    src: url('data:font/woff2;base64,') format('woff2');
}
/* EMBEDDED FONTS END */
        .ha-title {
            fill: #3d2b1f;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-size: 30px;
            font-weight: 700;
        }
        .ha-tagline {
            fill: #3d2b1f;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-size: 13px;
            font-style: italic;
        }
    </style>

    <defs>
        <radialGradient id="ha-inset" cx="0.5" cy="0.5" r="0.65">
            <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
        </radialGradient>
    </defs>

    <!-- Outer dark red background -->
    <rect width="300" height="200" fill="#4a0404"/>

    <!-- Gold frame (8px border) -->
    <rect x="15" y="15" width="270" height="170" fill="#c5a059"/>
    <!-- Cream inner -->
    <rect x="23" y="23" width="254" height="154" fill="#fdf6e3"/>
    <!-- Inner inset shadow -->
    <rect x="23" y="23" width="254" height="154" fill="url(#ha-inset)"/>

    <!-- Title + tagline (centered) -->
    <text x="150" y="100" text-anchor="middle" class="ha-title">Hidden Agenda</text>
    <text x="150" y="125" text-anchor="middle" class="ha-tagline">The Great Exhibition</text>
</svg>
